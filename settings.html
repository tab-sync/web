<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4c430">
  <title>Server settings · Tab Sync</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/settings.js"></script>
</head>
<body>
  <div class="page settings-shell">
    <main class="card settings-card" aria-labelledby="settings-title">
      <a class="back-link" href="/">← Back to Tab Sync</a>
      <p class="eyebrow">Settings</p>
      <h1 id="settings-title" class="settings-title">Server</h1>
      <p class="lede settings-lede">Choose the Tab Sync server this browser connects to.</p>

      <form id="settings-form" class="auth-form settings-form" novalidate>
        <label class="field">
          <span>Server URL</span>
          <input id="server-url" name="server-url" type="url" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" required placeholder="https://tabs.example.com">
        </label>
        <p class="settings-hint">Use HTTPS for a remote server. Changing servers signs you out in this browser.</p>
        <div class="settings-actions">
          <button class="button primary" type="submit">Save</button>
        </div>
      </form>
      <p id="settings-status" class="status" role="status" aria-live="polite" hidden></p>
      <p class="settings-privacy"><a href="/privacy">Privacy Policy</a></p>
    </main>
  </div>
</body>
</html>
